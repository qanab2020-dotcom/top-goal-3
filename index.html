function speak(text) {
  let utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function listenMic(word, elementId) {
  let indicator = document.getElementById('mic-status-' + elementId);
  indicator.style.display = 'block';
  speak(word);

  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    setTimeout(() => {
      indicator.style.display = 'none';
      alert('ميزة الميكروفون غير متصفحة بالكامل هنا، استمعت للنطق الصحيح لكلمة: ' + word);
    }, 1500);
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = function(event) {
    const speechResult = event.results[0][0].transcript.trim().toLowerCase();
    indicator.style.display = 'none';
    if(speechResult.includes(word.toLowerCase())) {
      alert('أحسنت! نطقك صحيح تماماً لـ: ' + word);
      totalStars += 2;
      document.getElementById('stars-count').textContent = totalStars;
    } else {
      alert('حاول مرة أخرى! سمعناك تنطق: "' + speechResult + '" والصحيح هو: ' + word);
    }
  };

  recognition.onerror = function() { indicator.style.display = 'none'; };
  recognition.onend = function() { indicator.style.display = 'none'; };

  try { recognition.start(); } catch(e) { indicator.style.display = 'none'; }
}

function toggleReveal(unitKey, index) {
  let box = document.getElementById('ar-' + unitKey + '-' + index);
  if (box.style.display === 'none') {
    box.style.display = 'block';
    totalStars += 1;
    document.getElementById('stars-count').textContent = totalStars;
  } else {
    box.style.display = 'none';
  }
}

function addWord(chip, unitKey) {
  let dropZone = document.getElementById('drop-' + unitKey);
  if(dropZone.innerText.includes("اسحب الكلمات")) {
    dropZone.innerHTML = "";
  }
  dropZone.appendChild(chip.cloneNode(true));
}

function resetSentence(unitKey) {
  let dropZone = document.getElementById('drop-' + unitKey);
  dropZone.innerHTML = 'اسحب الكلمات هنا بترتيبها الصحيح...';
  document.getElementById('feedback-' + unitKey).style.display = 'none';
}

function checkSentence(unitKey) {
  let realUnitKey = Object.keys(unitSentencesMap).find(k => k.replace(/\s+/g, '-') === unitKey);
  if(!realUnitKey) return;

  let sentencesList = unitSentencesMap[realUnitKey];
  let currentIndex = currentSentenceIndices[realUnitKey];
  let currentCorrectSentenceWords = sentencesList[currentIndex];

  let dropZone = document.getElementById('drop-' + unitKey);
  let userWords = [];
  dropZone.querySelectorAll('.word-chip').forEach(c => userWords.push(c.textContent));
  let userStr = userWords.join(" ");
  let correctStr = currentCorrectSentenceWords.join(" ");

  let fb = document.getElementById('feedback-' + unitKey);
  fb.style.display = 'block';

  if(userStr.toLowerCase() === correctStr.toLowerCase()) {
    totalStars += 3;
    document.getElementById('stars-count').textContent = totalStars;
    currentIndex++;
    currentSentenceIndices[realUnitKey] = currentIndex;

    if(currentIndex < sentencesList.length) {
      fb.style.background = '#2ed573';
      fb.style.color = '#fff';
      fb.textContent = `إجابة صحيحة! تم الانتقال تلقائياً للجملة التالية (${currentIndex + 1} من 6) 🎉`;
      
      setTimeout(() => {
        resetSentence(unitKey);
        document.getElementById('challenge-title-' + unitKey).textContent = `🧩 تدريب ترتيب الجمل (الجملة ${currentIndex + 1} من 6)`;
        let nextWords = [...sentencesList[currentIndex]].sort(() => Math.random() - 0.5);
        let chipsContainer = document.getElementById('chips-container-' + unitKey);
        chipsContainer.innerHTML = '';
        nextWords.forEach(w => {
          chipsContainer.innerHTML += `<div class="word-chip" onclick="addWord(this, '${unitKey}')">${w}</div>`;
        });
        fb.style.display = 'none';
      }, 1500);

    } else {
      fb.style.background = '#2ed573';
      fb.style.color = '#fff';
      fb.textContent = 'مذهل! أتممت جميع الجمل الـ 6 الخاصة بهذه الوحدة بنجاح تام! 🌟🏆';
      totalStars += 10;
      document.getElementById('stars-count').textContent = totalStars;
    }
  } else {
    fb.style.background = '#ff4757';
    fb.style.color = '#fff';
    fb.textContent = 'الترتيب غير صحيح، حاول مرة أخرى!';
  }
}

function selectOpt(optElement, isCorrect) {
  let parent = optElement.parentElement;
  parent.querySelectorAll('.opt').forEach(o => {
    o.style.pointerEvents = 'none';
    if(o === optElement) {
      o.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });
  let fb = parent.querySelector('.quiz-feedback');
  fb.style.display = 'block';
  fb.style.background = isCorrect ? '#2ed573' : '#ff4757';
  fb.style.color = '#fff';
  fb.textContent = isCorrect ? 'إجابة صحيحة! أحسنت 🌟' : 'إجابة خاطئة، حاول في الأسئلة القادمة!';
  if(isCorrect) {
    totalStars += 5;
    document.getElementById('stars-count').textContent = totalStars;
  }
}
