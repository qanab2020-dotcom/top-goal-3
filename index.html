function speak(t, rate=0.75){
  let u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = rate;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  totalStars++;
  document.getElementById('stars-count').textContent = totalStars;
}

const tabs = document.getElementById('tabs');

let first = true;

for(let unitName in allData){
  let b = document.createElement('button');
  b.className = 'tab' + (first ? ' active' : '');
  b.textContent = unitName;
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.unit').forEach(x => x.classList.remove('active'));
    document.getElementById('unit-' + unitName).classList.add('active');
  };

  let d = document.createElement('div');
  d.id = 'unit-' + unitName;
  d.className = 'unit' + (first ? ' active' : '');

  allData[unitName].forEach(w => {
    let cleanEn = w.en.replace(/'/g, "\\'");
    let id = w.en.replace(/[^a-zA-Z0-9]/g, '_') + '_' + unitName.replace(/[^a-zA-Z0-9]/g, '');
    gridHtml += `<div class="word-card">
      <div class="word-en">${w.en}</div>
      <div class="word-ar-box">${w.ar}</div>
      <div id="res-${id}" style="font-size:10px; color:#2ed573; font-weight:bold; margin-bottom:4px;"></div>
      <div class="card-btns">
        <button class="btn-mini btn-mic" onclick="listenWord('${cleanEn}', this, '${id}')">🎤</button>
        <button class="btn-mini btn-audio" onclick="speak('${cleanEn}')">🔊</button>
      </div>
    </div>`;
  });
  gridHtml += `</div>`;

  let rulesHtml = `<div class="rules-bottom-section"><div class="rules-title">📌 قواعد الوحدة:</div>`;
  if(rulesData[unitName]){
    rulesData[unitName].forEach(rule => {
      let cleanRuleText = (rule.title + ". " + rule.desc).replace(/'/g, "\\'");
      rulesHtml += `<div class="rule-box-item"><div class="rule-flex"><div><div class="rule-ar-title">🔹 ${rule.title}</div><div class="rule-ar-desc">${rule.desc}</div></div><button class="speak-rule-btn" onclick="speak('${cleanRuleText}')">🔊 استمع</button></div></div>`;

  let challengeHtml = `<div class="challenge-section" id="chal-${unitName}">

      <button class="btn-action" onclick="checkAnswer('${unitName}')">تحقق ✨</button>
    </div>
  </div>`;

  let convHtml = `<div class="conv-section"><div class="conv-title">💬 محادثة الوحدة:</div><div class="row">`;

    convData[unitName].forEach(c => {
      let cleanEnConv = c.en.replace(/'/g, "");
      convHtml += `<div class="bubble ${c.s=='A'?'a':'b'}"><b>${c.s}: ${c.en}</b><br><small>${c.ar}</small><br><button class="btn-conv" onclick="speak('${cleanEnConv}')">🔊 استمع</button></div>`;

  convHtml += `</div></div>`;

  let phonicsHtml = `<div class="phonics-section"><div class="phonics-title">🔊 الصوتيات والنطق (Phonics):</div>`;

  let readingHtml = `<div class="reading-section"><div class="reading-title">📚 قراءة النصوص:</div>`;

"U7 Styles":{"title":"U7: كتالوج أزياء","fields":["وصف لبس رخيص cheap","وصف لبس غالي expensive","قارن: as... as"]},
"U8 Events":{"title":"U8: Storyboard حدث أخير","fields":["عنوان الحدث (تخرجي / رحلتي)","ماذا حدث أولاً؟","ماذا حدث أخيراً؟","شعورك"]}
};

const projTabs = projUnitDiv.querySelector('#proj-tabs');
const projCont = projUnitDiv.querySelector('#proj-cont');
let projFirst = true;

for(let k in projs){
 let b = document.createElement('button');
 b.className = 'projects-tab' + (projFirst ? ' active' : '');
 b.textContent = k;
 b.onclick = () => {
  projTabs.querySelectorAll('.projects-tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  projCont.querySelectorAll('.projects-unit').forEach(x => x.classList.remove('active'));
  projCont.querySelector('#u-' + k).classList.add('active');
 };
 projTabs.appendChild(b);

 let d = document.createElement('div');
 d.id = 'u-' + k;
 d.className = 'projects-unit' + (projFirst ? ' active' : '');
 
 let html = `<h3>${projs[k].title}</h3><p>الاسم: <input id="name-${k}" placeholder="اسم الطالب"></p>`;
 projs[k].fields.forEach((f, i) => {
  html += `<label>${f}</label>${f.length < 20 ? `<input id="${k}-${i}">` : `<textarea id="${k}-${i}" rows="2"></textarea>`}`;
 });
 html += `<br><button class="projects-btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button> <button class="projects-btn print" onclick="speakProj('${projs[k].title}')">🔊</button>`;
 d.innerHTML = html;
 projCont.appendChild(d);
 projFirst = false;
}

function speakProj(t){
  let u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

window.chalStates = {};
for(let u in sentencesData) { window.chalStates[u] = 0; }

function moveWord(chip, unitName) {
  let zone = document.getElementById('zone-' + unitName);
  let bankContainer = document.getElementById('bank-' + unitName);
  if(chip.parentElement === bankContainer) { zone.appendChild(chip); } 
  else { bankContainer.appendChild(chip); }
}

function resetChallenge(unitName) {
  let idx = window.chalStates[unitName] || 0;
  let sList = sentencesData[unitName] || sentencesData["Welcome"];
  let targetS = sList[idx];
  let zone = document.getElementById('zone-' + unitName);
  let bankContainer = document.getElementById('bank-' + unitName);
  if(!zone || !bankContainer) return;
  zone.innerHTML = '';
  bankContainer.innerHTML = '';
  let shuffled = [...targetS.words].sort(() => Math.random() - 0.5);
  shuffled.forEach(w => {
    let span = document.createElement('span');
    span.className = 'word-chip';
    span.textContent = w;
    span.onclick = function() { moveWord(this, unitName); };
    bankContainer.appendChild(span);
  });
  let fb = document.getElementById('feedback-' + unitName);
  if(fb) fb.style.display = 'none';
}

function checkAnswer(unitName) {
  let idx = window.chalStates[unitName] || 0;
  let sList = sentencesData[unitName] || sentencesData["Welcome"];
  let targetS = sList[idx];
  let zone = document.getElementById('zone-' + unitName);
  let userWords = Array.from(zone.children).map(c => c.textContent);
  let userSentence = userWords.join(" ");
  let fb = document.getElementById('feedback-' + unitName);
  fb.style.display = 'block';
  
  if(userSentence === targetS.target) {
    fb.style.background = '#d4edda'; fb.style.color = '#155724';
    fb.innerHTML = '🎉 إجابة صحيحة ممتاز!';
    totalStars += 10; totalStreak += 1;
    document.getElementById('stars-count').textContent = totalStars;
    document.getElementById('streak-count').textContent = totalStreak;
    speak(targetS.target);
    setTimeout(() => {
      window.chalStates[unitName] = (window.chalStates[unitName] + 1) % sList.length;
      document.getElementById('counter-' + unitName).textContent = `جملة ${window.chalStates[unitName] + 1} من ${sList.length}`;
      resetChallenge(unitName);
    }, 2000);
  } else {
    fb.style.background = '#f8d7da'; fb.style.color = '#721c24';
    fb.innerHTML = '❌ إجابة خاطئة، حاول مجدداً بالشكل الصحيح.';
  }
}

window.quizStates = {};
for(let u in allData) { window.quizStates[u] = 0; }

function loadQuiz(unitName) {
  let qIdx = window.quizStates[unitName] || 0;
  let cur = bank[qIdx % bank.length];
  let box = document.getElementById('quiz-box-' + unitName);
  let fb = document.getElementById('quiz-fb-' + unitName);
  if(!box) return;
  fb.style.display = 'none';
  box.innerHTML = `<div class="quiz-q">${qIdx + 1}. ${cur.q}</div>` + 
    cur.opts.map((o, i) => `<div class="opt" id="opt-${unitName}-${i}" onclick="checkQuiz('${unitName}', ${i}, this)">${o}</div>`).join('');
}

function checkQuiz(unitName, i, el) {
  let qIdx = window.quizStates[unitName] || 0;
  let cur = bank[qIdx % bank.length];
  let fb = document.getElementById('quiz-fb-' + unitName);
  
  let allOpts = document.querySelectorAll(`[id^="opt-${unitName}-"]`);
  allOpts.forEach(o => o.style.pointerEvents = 'none');

  fb.style.display = 'block';
  if(i === cur.a){
    el.classList.add('correct');
    fb.style.background = '#d4edda';
    fb.style.color = '#155724';
    fb.innerHTML = '✅ إجابة صحيحة أحسنت!';
    totalStars += 5;
    totalStreak += 1;
    document.getElementById('stars-count').textContent = totalStars;
    document.getElementById('streak-count').textContent = totalStreak;
  } else {
    el.classList.add('wrong');
    let correctEl = document.getElementById(`opt-${unitName}-${cur.a}`);
    if(correctEl) correctEl.classList.add('correct');
    
    fb.style.background = '#f8d7da';
    fb.style.color = '#721c24';
    fb.innerHTML = '❌ إجابة خاطئة! الإجابة الصحيحة باللون الأخضر.';
  }
}

function nextQuiz(unitName) {
  window.quizStates[unitName] = ((window.quizStates[unitName] || 0) + 1) % bank.length;
  loadQuiz(unitName);
}

function resetQuiz(unitName) {
  window.quizStates[unitName] = 0;
  loadQuiz(unitName);
}

function listenWord(target, btn, id){
  let Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){alert('يرجى فتح الصفحة في متصفح جوجل كروم (Google Chrome)');return;}
  let rec = new Rec();
  rec.lang = 'en-US';
  btn.classList.add('listening');
  btn.textContent = '🎧';
  document.getElementById('status-msg').textContent = '🎤 انطق الكلمة: ' + target;
  
  rec.onresult = (e) => {
    let said = e.results[0][0].transcript;
    let res = document.getElementById('res-' + id);
    let ok = said.toLowerCase().includes(target.toLowerCase().split(' ')[0]) || target.toLowerCase().includes(said.toLowerCase());
    if(ok){
      res.textContent = '✅ ممتاز!';
      speak('Excellent');
      totalStars += 5;
      totalStreak += 1;
    } else {
      res.textContent = '🔁 قلت: ' + said;
    }
    btn.classList.remove('listening');
    btn.textContent = '🎤';
    document.getElementById('stars-count').textContent = totalStars;
    document.getElementById('streak-count').textContent = totalStreak;
  };
  rec.onerror = () => {
    btn.classList.remove('listening');
    btn.textContent = '🎤';
  };
  rec.start();
}
</script>
